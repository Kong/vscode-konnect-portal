name: Publish

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel in progress jobs to ensure code is deployed
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-tests:
    name: Tests
    uses: ./.github/workflows/test.yaml

  publish:
    name: Publish Extension
    needs: [run-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: write
      actions: read
      pull-requests: write

    env:
      FORCE_COLOR: "1"
    steps:
      - name: Generate Kong token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token-kong
        with:
          client-id: ${{ vars.CORE_UI_GH_APP_READ_ID }}
          private-key: ${{ secrets.CORE_UI_GH_APP_READ_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          token: ${{ steps.app-token-kong.outputs.token }}

      - name: Setup PNPM with Dependencies
        uses: ./.github/actions/setup-pnpm-with-dependencies/

      - name: Set up git user
        run: |
          git config user.name 'kong-ui[bot]'
          git config user.email "konnectx-engineers+kongponents-bot@konghq.com"

      - name: Version the extension and generate changelog
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token-kong.outputs.token }}
        run: |
          # Version the extension, update the CHANGELOG.md, and create the git tag
          pnpm release

          # Extract version from package.json and set as step output
          VERSION=$(jq -r '.version' package.json)
          echo "New version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Pull in latest main branch changes
          git pull --rebase --tags origin main

          # Push changes to main branch
          git push origin main --follow-tags

      - name: Build extension package
        run: pnpm package

      - name: Publish extension to VS Code marketplace
        if: ${{ steps.version.outputs.version != '' }}
        env:
          VSCE_PAT: ${{ secrets.AZURE_DEVOPS_MARKETPLACE_PUBLISH_TOKEN }}
        run: |
          pnpm vsce publish ${{ steps.version.outputs.version }} \
            --no-update-package-json \
            --no-git-tag-version

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          pnpm ovsx publish *.vsix

      - name: Create GitHub Release
        if: ${{ steps.version.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token-kong.outputs.token }}
        run: |
          # Pull in latest main branch changes
          git fetch --tags

          # Confirm tag exists
          git tag -l "v${{ steps.version.outputs.version }}"

          # Create GitHub Release using the generated tag and changelog
          gh release create "v${{ steps.version.outputs.version }}" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-from-tag
