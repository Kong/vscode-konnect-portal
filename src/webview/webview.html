<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; frame-src *; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <title>Portal Preview</title>
    {%%TEMPLATE_CSS_CONTENT%%}
  </head>

  <body>
    <div class="container">
      <div class="viewport-toolbar">
        <div class="viewport-switcher" id="viewport-switcher" role="group" aria-label="Preview viewport">
          <button type="button" class="viewport-button active" id="viewport-desktop" data-viewport="desktop" data-tooltip="Desktop" aria-pressed="true" title="Desktop">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M1.5 2.5h13a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-.5.5H10v1h1.5a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1H6v-1H1.5a.5.5 0 0 1-.5-.5V3a.5.5 0 0 1 .5-.5ZM2 4v6.5h12V4H2Zm5 7.5v1h2v-1H7Z"/>
            </svg>
            <span class="viewport-button-label">Desktop</span>
          </button>
          <button type="button" class="viewport-button" id="viewport-tablet" data-viewport="tablet" data-tooltip="Tablet" aria-pressed="false" title="Tablet">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M3.5 1h9a.5.5 0 0 1 .5.5v13a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5v-13a.5.5 0 0 1 .5-.5ZM4 2.5v11h8v-11H4Zm3.5 12a.5.5 0 0 0 0 1h1a.5.5 0 0 0 0-1h-1Z"/>
            </svg>
            <span class="viewport-button-label">Tablet</span>
          </button>
          <button type="button" class="viewport-button" id="viewport-mobile" data-viewport="mobile" data-tooltip="Mobile" aria-pressed="false" title="Mobile">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M4.5 1h7a.5.5 0 0 1 .5.5v13a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5v-13a.5.5 0 0 1 .5-.5ZM5 2.5v11h6v-11H5Zm2.25 12a.5.5 0 0 0 0 1h1.5a.5.5 0 0 0 0-1h-1.5Z"/>
            </svg>
            <span class="viewport-button-label">Mobile</span>
          </button>
        </div>
      </div>
      <div class="iframe-container" id="iframe-container">
        <div class="loading-overlay" id="loading-overlay">
          <div class="loading-content">
            <h3 class="loading-title">Loading Portal Preview</h3>
            <div class="loading-progress">
              <div class="loading-progress-bar"></div>
            </div>
            <p class="loading-text">Connecting to {%%TEMPLATE_PORTAL_ORIGIN%%}</p>
          </div>
        </div>
        <div class="error-overlay hidden" id="error-overlay">
          <div class="error-content">
            <h3 class="error-title">Portal Preview Error</h3>
            <p class="error-text" id="error-message">Unable to connect to the portal preview.</p>
            <div class="error-code" id="error-code" style="display: none;"></div>
          </div>
        </div>
        <iframe id="portal-preview" src="{%%TEMPLATE_IFRAME_SRC%%}" title="Portal Preview" width="100%" height="100%"
          allow="clipboard-read; clipboard-write; storage-access"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads allow-storage-access-by-user-activation"
          loading="eager" style="border: none; display: block;"></iframe>
      </div>
    </div>
    {%%TEMPLATE_JS_CONTENT%%}
  </body>

</html>
